name: scorecard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scorecard
      POSTGRES_USER: scorecard
      POSTGRES_PASSWORD: scorecard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The API migrates on startup, so it must not race the database.
      test: ["CMD-SHELL", "pg_isready -U scorecard -d scorecard"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=scorecard;Username=scorecard;Password=scorecard"
      Database__MigrateOnStartup: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
